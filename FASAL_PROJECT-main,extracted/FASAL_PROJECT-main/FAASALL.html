    <style>
        /* ═══════════════════════════════════════ */
        /* CSS Design System & Global Styles       */
        /* ═══════════════════════════════════════ */
        :root {
            /* Dark cinematic palette */
            --bg-base: #060f1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.07);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Accent colors */
            --emerald: #34d399;
            --gold: #f0b429;
            --sky: #38bdf8;
            --orange: #e8772e;
            --teal: #2dd4bf;
            --red: #f87171;
            
            /* Gradients */
            --grad-emerald-sky: linear-gradient(135deg, #34d399 0%, #2dd4bf 50%, #38bdf8 100%);
            --grad-dark-terraced: linear-gradient(to bottom, #051622 0%, #060f1a 50%, #0a1128 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: var(--grad-dark-terraced);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        /* ═══════════════════════════════════════ */
        /* Utility Classes                         */
        /* ═══════════════════════════════════════ */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .gradient-text {
            background: var(--grad-emerald-sky);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .section-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            margin: 4rem 0;
            width: 100%;
        }

        /* Form elements */
        .input-group {
            margin-bottom: 1.25rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--emerald);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--emerald);
        }

        button.btn-primary {
            background: var(--grad-emerald-sky);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button.btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        button.btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .lang-switch select {
            width: auto;
            padding: 0.4rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 2rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        /* ═══════════════════════════════════════ */
        /* Layouts & Components                    */
        /* ═══════════════════════════════════════ */
        
        .hero {
            padding: 5rem 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }
        @media(max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                padding: 3rem 0;
                text-align: center;
            }
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(52, 211, 153, 0.1);
            color: var(--emerald);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }
        @media(max-width: 768px) { .hero h1 { font-size: 2.5rem; } }
        .hero p {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--emerald);
            border-radius: 50%;
            position: relative;
        }
        .live-dot::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            border: 2px solid var(--emerald);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .stats-row {
            display: flex;
            gap: 2rem;
            margin-top: 3rem;
        }
        @media(max-width: 768px) { .stats-row { justify-content: center; flex-wrap: wrap; } }
        .stat-item h4 {
            font-size: 1.5rem;
            color: var(--text-main);
        }
        .stat-item p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin: 0;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        /* Loader */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .score-circle {
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: 'Outfit';
        }
        .score-excellent { background: rgba(52, 211, 153, 0.1); color: var(--emerald); border: 2px solid var(--emerald); }
        .score-good { background: rgba(240, 180, 41, 0.1); color: var(--gold); border: 2px solid var(--gold); }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-risk-low { background: rgba(52, 211, 153, 0.1); color: var(--emerald); }
        .badge-risk-med { background: rgba(240, 180, 41, 0.1); color: var(--gold); }
        .badge-risk-high { background: rgba(248, 113, 113, 0.1); color: var(--red); }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-8 { margin-top: 2rem; }
        .text-center { text-align: center; }
        .text-sm { font-size: 0.875rem; }
        .text-muted { color: var(--text-muted); }
        
        /* Seasonal Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: 80px repeat(12, 1fr);
            gap: 2px;
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        .cal-header { font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 0.5rem 0; }
        .cal-row { display: contents; }
        .cal-label { padding: 0.5rem; font-weight: 500; font-size: 0.875rem; display: flex; align-items: center; }
        .cal-cell {
            background: rgba(255,255,255,0.02);
            height: 30px;
            margin: auto 0;
            border-radius: 2px;
            position: relative;
        }
        .cal-sow { background: var(--gold); opacity: 0.8; }
        .cal-tend { background: var(--emerald); opacity: 0.6; }
        .cal-harvest { background: var(--orange); opacity: 0.8; }

        /* Icon Wrapper */
        .icon-box {
            width: 40px; height: 40px;
            border-radius: 0.5rem;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05);
            font-size: 1.25rem;
        }
    </style>
</head>

        const scoreCropAgainstField = (crop, field) => {
            let score = 0;
            let details = [];

            // 1. Soil Match (28%)
            if (crop.soil.includes(field.soilType)) {
                score += 28;
            } else {
                score += 10; // Partial fit
            }

            // 2. Climate/Rainfall Fit (24%)
            const rain = parseInt(field.rain);
            if (rain >= crop.minRain && rain <= crop.maxRain) {
                score += 24;
            } else if (field.irrigation === "Yes" && rain < crop.minRain) {
                score += 20; // Irrigation compensates
            } else {
                score += 5;
            }

            // 3. Season Fit (14%)
            if (crop.season === field.season) {
                score += 14;
            }

            // 4. pH Fit (10%)
            const ph = parseFloat(field.ph);
            if (ph >= crop.minPh && ph <= crop.maxPh) {
                score += 10;
            }

            // 5. Demand (16%)
            if (crop.demand === "Very High") score += 16;
            else if (crop.demand === "High") score += 12;
            else score += 8;

            // 6. Risk (8%)
            if (crop.risk === "Low") score += 8;
            else if (crop.risk === "Medium") score += 5;
            else score += 2;

            return {
                ...crop,
                score: Math.min(Math.round(score), 99),
                netProfit: (crop.yield * crop.price) - crop.cost
            };
        };

                                    </select>
                                </div>

                                <button className="btn-primary" style={{ width: '100%', marginTop: '1rem' }} onClick={runRecommendation} disabled={isAnalyzing}>
                                    {isAnalyzing ? <><div className="spinner"></div> {t.btnRunning}</> : t.btnRunAI}
                                </button>
                            </div>

                            {/* Results Area */}
                            <div>
                                {results ? (
                                    <div>
                                        <h3 className="mb-4">{t.resTop}</h3>
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                            {results.map((crop, idx) => (
                                                <div key={idx} className="glass-card" style={{ padding: '1rem', borderLeft: `4px solid ${idx === 0 ? 'var(--emerald)' : 'var(--border-card)'}` }}>
                                                    <div className="flex-between mb-2">
                                                        <h4 style={{ fontSize: '1.25rem' }}>{crop.names[lang]}</h4>
                                                        <div className={`score-circle ${crop.score >= 80 ? 'score-excellent' : 'score-good'}`} style={{ width: 40, height: 40, fontSize: '0.875rem' }}>
                                                            {crop.score}%
                                                        </div>
                                                    </div>
                                                    <div className="grid-3 mb-2" style={{ gap: '0.5rem' }}>
                                                        <div>
                                                            <div className="text-sm text-muted">{t.resProfit}</div>
                                                            <div style={{ color: 'var(--emerald)', fontWeight: 'bold' }}>₹{crop.netProfit.toLocaleString()}/ac</div>
                                                        </div>
                                                        <div>
                                                            <div className="text-sm text-muted">{t.resRisk}</div>
                                                            <div>{crop.risk}</div>
                                                        </div>
                                                        <div>
                                                            <div className="text-sm text-muted">{t.resDemand}</div>
                                                            <div>{crop.demand}</div>
                                                        </div>
                                                    </div>
                                                    <div className="text-sm" style={{ background: 'rgba(0,0,0,0.2)', padding: '0.5rem', borderRadius: '0.25rem' }}>
                                                        <strong>{t.resTip}:</strong> {crop.tip[lang]}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="glass-card" style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', color: 'var(--text-muted)' }}>
                                        <div>
                                            <div style={{ fontSize: '3rem', marginBottom: '1rem', opacity: 0.5 }}>🌾</div>
                                            <p>{t.secAI_sub}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    <div className="section-divider"></div>

                    {/* Data Dashboards */}
                    <section className="container" style={{ padding: '2rem 0' }}>
                        <div className="grid-2">
                            
                            {/* Weather */}
                            <div className="glass-card">
                                <h3 className="mb-2">{t.secWeather}</h3>
                                <p className="text-muted text-sm mb-4">{t.secWeather_sub}</p>
                                
                                {weather ? (
                                    <>
                                        <div className="flex-between mb-6" style={{ background: 'rgba(0,0,0,0.2)', padding: '1rem', borderRadius: '0.5rem' }}>
                                            <div className="text-center">
                                                <div style={{ fontSize: '2rem', fontWeight: 'bold' }}>{weather.current.temperature_2m}°C</div>
                                                <div className="text-sm text-muted">{t.weatherTemp}</div>
                                            </div>
                                            <div className="text-center">
                                                <div style={{ fontSize: '1.25rem' }}>{weather.current.relative_humidity_2m}%</div>
                                                <div className="text-sm text-muted">{t.weatherHum}</div>
                                            </div>
                                            <div className="text-center">
                                                <div style={{ fontSize: '1.25rem' }}>{weather.current.wind_speed_10m} km/h</div>
                                                <div className="text-sm text-muted">{t.weatherWind}</div>
                                            </div>
                                        </div>
                                        <div style={{ height: 200, width: '100%' }}>
                                            <ResponsiveContainer>
                                                <LineChart data={weather.forecast}>
                                                    <XAxis dataKey="day" stroke="var(--text-muted)" fontSize={12} tickLine={false} axisLine={false} />
                                                    <Tooltip contentStyle={{ background: 'var(--bg-base)', border: '1px solid var(--border-card)' }} />
                                                    <Line type="monotone" dataKey="max" stroke="var(--orange)" strokeWidth={2} dot={{r:4}} />
                                                    <Line type="monotone" dataKey="min" stroke="var(--sky)" strokeWidth={2} dot={{r:4}} />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </>
                                ) : (
                                    <div style={{ height: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }} className="text-muted">
                                        Select location and run analysis to view local weather.
                                    </div>
                                )}
                            </div>

                            {/* Market Trends */}
                            <div className="glass-card">
                                <h3 className="mb-2">{t.secMarket}</h3>
                                <p className="text-muted text-sm mb-4">{t.secMarket_sub}</p>
                                <div style={{ height: 280, width: '100%' }}>
                                    <ResponsiveContainer>
                                        <LineChart data={marketData}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.1)" vertical={false} />
                                            <XAxis dataKey="month" stroke="var(--text-muted)" fontSize={12} />
                                            <YAxis stroke="var(--text-muted)" fontSize={12} tickFormatter={(val) => `₹${val}`} />
                                            <Tooltip contentStyle={{ background: 'var(--bg-base)', border: '1px solid var(--border-card)' }} />
                                            <Line type="monotone" dataKey="soybean" name="Soybean (₹/kg)" stroke="var(--emerald)" strokeWidth={2} />
                                            <Line type="monotone" dataKey="cotton" name="Cotton (₹/kg)" stroke="var(--gold)" strokeWidth={2} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                        </div>
                    </section>

                    {/* Soil Health (Radar) & Calc */}
                    <section className="container" style={{ padding: '2rem 0' }}>
                        <div className="grid-2">
                            
                            <div className="glass-card">
                                <h3 className="mb-2">{t.secSoil}</h3>
                                <p className="text-muted text-sm mb-4">{t.secSoil_sub}</p>
                                <div style={{ height: 300, width: '100%' }}>
                                    <ResponsiveContainer>
                                        <RadarChart cx="50%" cy="50%" outerRadius="80%" data={[
                                            { subject: 'pH', A: 80, fullMark: 100 },
                                            { subject: 'Nitrogen', A: 60, fullMark: 100 },
                                            { subject: 'Phosphorus', A: 75, fullMark: 100 },
                                            { subject: 'Potassium', A: 65, fullMark: 100 },
                                            { subject: 'Org. Carbon', A: 45, fullMark: 100 },
                                            { subject: 'Moisture', A: 70, fullMark: 100 }
                                        ]}>
                                            <PolarGrid stroke="rgba(255,255,255,0.1)" />
                                            <PolarAngleAxis dataKey="subject" tick={{ fill: 'var(--text-muted)', fontSize: 12 }} />
                                            <Radar name="Field" dataKey="A" stroke="var(--emerald)" fill="var(--emerald)" fillOpacity={0.4} />
                                        </RadarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="glass-card">
                                <h3 className="mb-2">{t.secCalc}</h3>
                                <div className="grid-2 mt-4">
                                    <div className="input-group">
                                        <label>{t.lblLand}</label>
                                        <input type="number" defaultValue="5" id="c_land" />
                                    </div>
                                    <div className="input-group">
                                        <label>{t.lblYield}</label>
                                        <input type="number" defaultValue="800" id="c_yield" />
                                    </div>
                                    <div className="input-group">
                                        <label>{t.lblPrice}</label>
                                        <input type="number" defaultValue="45" id="c_price" />
                                    </div>
                                    <div className="input-group">
                                        <label>{t.lblCost}</label>
                                        <input type="number" defaultValue="12000" id="c_cost" />
                                    </div>
                                </div>
                                <button className="btn-primary mb-6" style={{width: '100%'}} onClick={() => {
                                    const l = parseFloat(document.getElementById('c_land').value);
                                    const y = parseFloat(document.getElementById('c_yield').value);
                                    const p = parseFloat(document.getElementById('c_price').value);
                                    const c = parseFloat(document.getElementById('c_cost').value);
                                    
                                    const gross = l * y * p;
                                    const cost = l * c;
                                    const net = gross - cost;
                                    const roi = ((net / cost) * 100).toFixed(1);
                                    
                                    document.getElementById('calc_res_gross').innerText = `₹${gross.toLocaleString()}`;
                                    document.getElementById('calc_res_net').innerText = `₹${net.toLocaleString()}`;
                                    document.getElementById('calc_res_roi').innerText = `${roi}%`;
                                }}>Calculate</button>

                                <div className="flex-between" style={{ background: 'rgba(0,0,0,0.2)', padding: '1rem', borderRadius: '0.5rem' }}>
                                    <div>
                                        <div className="text-sm text-muted">{t.calcGross}</div>
                                        <div id="calc_res_gross" style={{ fontWeight: 'bold' }}>₹1,80,000</div>
                                    </div>
                                    <div>
                                        <div className="text-sm text-muted">{t.calcNet}</div>
                                        <div id="calc_res_net" style={{ color: 'var(--emerald)', fontWeight: 'bold', fontSize: '1.25rem' }}>₹1,20,000</div>
                                    </div>
                                    <div>
                                        <div className="text-sm text-muted">{t.calcROI}</div>
                                        <div id="calc_res_roi" style={{ fontWeight: 'bold' }}>200.0%</div>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </section>

                    {/* About Features */}
                    <section className="container" style={{ padding: '4rem 0' }}>
                        <div className="text-center mb-8">
                            <h2>{t.aboutTitle}</h2>
                        </div>
                        <div className="grid-3">
                            <div className="glass-card">
                                <div className="icon-box mb-4">🌦️</div>
                                <h4>{t.feat1}</h4>
                                <p className="text-sm text-muted mt-2">{t.feat1d}</p>
                            </div>
                            <div className="glass-card">
                                <div className="icon-box mb-4">🌍</div>
                                <h4>{t.feat2}</h4>
                                <p className="text-sm text-muted mt-2">{t.feat2d}</p>
                            </div>
                            <div className="glass-card">
                                <div className="icon-box mb-4">📈</div>
                                <h4>{t.feat3}</h4>
                                <p className="text-sm text-muted mt-2">{t.feat3d}</p>
                            </div>
                        </div>
                        <p className="text-center text-sm mt-8" style={{ color: 'var(--orange)' }}>
                            {t.disclaimer}
                        </p>
                    </section>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
